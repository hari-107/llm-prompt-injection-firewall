{% extends "dashboard/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content_anon %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="card-body p-4">
      <h1 class="h4 mb-1"><i class="bi bi-shield-lock-fill text-primary"></i> PI Firewall</h1>
      <p class="text-dim small mb-4">LLM Prompt Injection Firewall &amp; Security Gateway</p>
      {% if messages %}{% for m in messages %}<div class="alert alert-danger py-2">{{ m }}</div>{% endfor %}{% endif %}
      <form method="post" action="{% url 'dashboard:login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small">Username</label>
          <input name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label small">Password</label>
          <input name="password" type="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
